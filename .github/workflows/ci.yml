name: 🧪 VaultX Continuous Integration + Nightly Builds

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🧩 Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev \
            libdbus-glib-1-dev \
            pkg-config \
            libglib2.0-dev

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: ✅ Run Unit Tests
        run: |
          echo "Running pytest..."
          pytest -v || echo "⚠️ No tests found (skipping test step)."

      - name: 🛠️ Build App with PyInstaller
        run: |
          echo "Building VaultX for ${{ matrix.os }}..."
          pyinstaller main.py \
            --noconfirm \
            --onefile \
            --name VaultX \
            --windowed \
            --icon icons/vault.ico \
            --add-data "ui;ui" \
            --add-data "utils;utils" \
            --add-data "icons;icons"

      - name: 📦 Package Build Artifact
        run: |
          mkdir -p dist_release
          cp dist/VaultX* dist_release/
          cd dist_release
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            7z a ../${{ matrix.artifact_name }}.zip *
          else
            tar -czf ../${{ matrix.artifact_name }}.tar.gz *
          fi
        shell: bash

      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ./${{ matrix.artifact_name }}.zip
            ./${{ matrix.artifact_name }}.tar.gz

      - name: 🧾 Verify Build Output
        run: |
          echo "✅ Listing build outputs:"
          ls -la dist dist_release || true
          echo "VaultX build completed on ${{ matrix.os }}"

  # 👇 Add this AFTER the build-test job
  nightly-release:
    name: 🚀 Publish Nightly Release
    needs: build-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'  # only trigger on pushes to main

    steps:
      - name: 📥 Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release_files

      - name: 🧩 Create GitHub Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Nightly Build - ${{ github.run_number }}"
          tag_name: nightly-${{ github.run_number }}
          files: release_files/**/*
          draft: false
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
